<!-- Back to top button -->
<button id="ac-back-to-top" aria-label="Back to Top" title="Back to Top">
  <i class="fas fa-arrow-up"></i>
</button>

<!-- Academic Enhanced Interactive Scripts -->
<script>
  // 1. Back to Top Scroll Behavior
  (function() {
    var btt = document.getElementById('ac-back-to-top');
    if (btt) {
      window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
          btt.classList.add('visible');
        } else {
          btt.classList.remove('visible');
        }
      });
      btt.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  })();

  // 2. BibTeX Toggle and Copy Functions
  function toggleBibtex(id) {
    var el = document.getElementById(id);
    if (el) {
      el.classList.toggle('active');
    }
  }

  function copyBibtex(id, btn) {
    var block = document.getElementById(id);
    if (!block) return;
    var contentEl = block.querySelector('.pub-bibtex-content');
    if (!contentEl) return;
    var text = contentEl.innerText || contentEl.textContent;
    navigator.clipboard.writeText(text).then(function() {
      var origText = btn.innerText;
      btn.innerText = '✓ Copied!';
      btn.style.background = '#15803d';
      btn.style.color = '#ffffff';
      setTimeout(function() {
        btn.innerText = origText;
        btn.style.background = '';
        btn.style.color = '';
      }, 2000);
    }).catch(function() {
      alert('Failed to copy. Please select and copy manually.');
    });
  }
</script>
